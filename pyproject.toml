[project]
name = "alpaca-vrp-engine"
version = "1.0.0"
description = "VRP Engine: a paper-only autonomous agent that trades the variance risk premium with defined-risk option structures on Alpaca."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "alpaca-py>=0.44.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # 1.51 is the floor for `width="stretch"`, which replaces the deprecated
    # `use_container_width` the dashboard used to pass.
    "streamlit>=1.51.0",
    # Used directly by the dashboard tables and charts. Altair arrives with
    # Streamlit itself, so the charts add no dependency of their own.
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]
# The LLM analyst narrates the regime and may soft-veto. The engine runs without it.
llm = [
    "openai>=1.50.0",
]
# Research plane: the agent talks to Alpaca's MCP server over stdio.
mcp = [
    "mcp>=1.2.0",
]

[project.scripts]
smoke-paper = "vrp_engine.cli:smoke"
run-agent = "vrp_engine.cli:run_agent"
scan = "vrp_engine.cli:scan"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Streamlit Cloud does not run `uv sync`, so src/ is inserted on sys.path before imports.
"app/streamlit_app.py" = ["E402"]
