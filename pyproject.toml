[project]
name = "alpaca-options-agent"
version = "0.1.0"
description = "Paper-only AI options overlay agent for the Alpaca AI Trading Agents Hackathon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "alpaca-py>=0.44.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]
# Wired after kickoff, when the agent starts reasoning with an LLM.
llm = [
    "openai>=1.50.0",
]

[project.scripts]
smoke-paper = "options_agent.cli:smoke"
run-agent = "options_agent.cli:run_agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
